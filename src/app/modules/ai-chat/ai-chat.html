<!-- ========================================================= -->
<!-- FLOATING CHAT BUTTON -->
<!-- ========================================================= -->

<button
  type="button"
  (click)="toggleChat()"
  class="fixed bottom-6 right-6 z-[9998] w-14 h-14 rounded-full bg-purple-600 hover:bg-purple-700 text-white shadow-xl flex items-center justify-center transition cursor-pointer"
  title="AI Assistant"
>
  <i class="bi text-2xl" [ngClass]="isOpen ? 'bi-x-lg' : 'bi-stars'"></i>
</button>

<!-- ========================================================= -->
<!-- CHAT PANEL -->
<!-- ========================================================= -->

<div
  *ngIf="isOpen"
  class="fixed bottom-24 right-6 z-[9998] w-[390px] max-w-[calc(100vw-2rem)] h-[570px] max-h-[calc(100vh-8rem)] bg-white rounded-2xl shadow-2xl border border-gray-200 overflow-hidden flex flex-col"
>
  <!-- ======================================================= -->
  <!-- HEADER -->
  <!-- ======================================================= -->

  <div
    class="px-5 py-4 bg-gradient-to-r from-purple-600 to-indigo-600 text-white flex items-center justify-between shrink-0"
  >
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-white/15 flex items-center justify-center">
        <i class="bi bi-stars text-xl"></i>
      </div>

      <div>
        <h3 class="font-bold">EMS AI Assistant</h3>

        <div class="flex items-center gap-2 mt-0.5">
          <span class="w-2 h-2 rounded-full bg-green-300"></span>

          <p class="text-xs text-purple-100">
            {{ role }}
          </p>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-1">
      <!-- CLEAR -->

      <button
        type="button"
        (click)="clearChat()"
        [disabled]="loading"
        class="w-9 h-9 rounded-lg hover:bg-white/10 flex items-center justify-center cursor-pointer disabled:opacity-50"
        title="Clear Chat"
      >
        <i class="bi bi-trash3"></i>
      </button>

      <!-- CLOSE -->

      <button
        type="button"
        (click)="closeChat()"
        class="w-9 h-9 rounded-lg hover:bg-white/10 flex items-center justify-center cursor-pointer"
        title="Close"
      >
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>

  <!-- ======================================================= -->
  <!-- MESSAGE BODY -->
  <!-- ======================================================= -->

  <div #chatBody class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
    <div
      *ngFor="let item of messages"
      class="flex"
      [ngClass]="{
        'justify-end': item.sender === 'USER',

        'justify-start': item.sender === 'AI',
      }"
    >
      <div class="max-w-[85%]">
        <!-- MESSAGE -->

        <div
          class="px-4 py-3 rounded-2xl text-sm leading-6"
          [ngClass]="{
            'bg-purple-600 text-white rounded-br-md': item.sender === 'USER',

            'bg-white border border-gray-200 text-slate-700 rounded-bl-md shadow-sm':
              item.sender === 'AI' && !item.error,

            'bg-red-50 border border-red-200 text-red-700 rounded-bl-md': item.error,
          }"
        >
          <!-- USER -->

          <div *ngIf="item.sender === 'USER'" class="whitespace-pre-line">
            {{ item.text }}
          </div>

          <!-- AI MARKDOWN -->

          <div
            *ngIf="item.sender === 'AI'"
            class="ai-message"
            [innerHTML]="formatMessage(item.text)"
          ></div>
        </div>

        <!-- TIMESTAMP -->

        <p
          class="text-[10px] text-gray-400 mt-1"
          [ngClass]="{
            'text-right': item.sender === 'USER',

            'text-left': item.sender === 'AI',
          }"
        >
          {{ item.timestamp | date: 'hh:mm a' }}
        </p>
      </div>
    </div>

    <!-- ===================================================== -->
    <!-- AI TYPING INDICATOR -->
    <!-- ===================================================== -->

    <div *ngIf="loading" class="flex justify-start">
      <div class="bg-white border border-gray-200 rounded-2xl rounded-bl-md px-4 py-3 shadow-sm">
        <div class="flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-gray-400 animate-bounce"></span>

          <span
            class="w-2 h-2 rounded-full bg-gray-400 animate-bounce [animation-delay:150ms]"
          ></span>

          <span
            class="w-2 h-2 rounded-full bg-gray-400 animate-bounce [animation-delay:300ms]"
          ></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ======================================================= -->
  <!-- QUICK QUESTIONS -->
  <!-- ======================================================= -->

  <div *ngIf="messages.length <= 1" class="px-4 pt-3 bg-white border-t border-gray-100 shrink-0">
    <p class="text-xs font-semibold text-gray-500 mb-2">Try asking</p>

    <div class="flex gap-2 overflow-x-auto pb-3">
      <button
        *ngFor="let question of quickQuestions"
        type="button"
        (click)="sendQuickQuestion(question)"
        [disabled]="loading"
        class="whitespace-nowrap px-3 py-2 rounded-full bg-purple-50 text-purple-700 border border-purple-100 text-xs font-medium hover:bg-purple-100 transition cursor-pointer disabled:opacity-50"
      >
        {{ question }}
      </button>
    </div>
  </div>

  <!-- ======================================================= -->
  <!-- INPUT -->
  <!-- ======================================================= -->

  <div class="p-4 border-t border-gray-200 bg-white shrink-0">
    <div class="flex items-end gap-2">
      <textarea
        [(ngModel)]="message"
        (keydown.enter)="onEnter($event)"
        [disabled]="loading"
        rows="1"
        placeholder="Ask about attendance, leave, salary..."
        class="flex-1 resize-none px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm max-h-24 disabled:bg-gray-100"
      ></textarea>

      <!-- SEND BUTTON -->

      <button
        type="button"
        (click)="sendMessage()"
        [disabled]="loading || !message.trim()"
        class="w-11 h-11 rounded-xl bg-purple-600 hover:bg-purple-700 disabled:bg-purple-300 text-white flex items-center justify-center shrink-0 cursor-pointer disabled:cursor-not-allowed"
      >
        <i *ngIf="!loading" class="bi bi-send-fill"></i>

        <i *ngIf="loading" class="bi bi-arrow-repeat animate-spin"></i>
      </button>
    </div>

    <p class="text-[10px] text-gray-400 text-center mt-2">
      AI answers are based on available EMS data.
    </p>
  </div>
</div>
