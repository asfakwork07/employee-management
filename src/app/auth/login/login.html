<div
  class="h-screen overflow-hidden bg-gradient-to-br from-blue-700 via-indigo-700 to-purple-700 flex items-center justify-center p-4">

  <div class="w-full max-w-5xl h-[88vh] bg-white rounded-3xl shadow-2xl overflow-hidden grid md:grid-cols-2">

    <!-- Left Side -->
    <div
      class="hidden md:flex flex-col justify-center items-center bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-8">

      <div class="w-28 h-28 rounded-full bg-white/20 flex items-center justify-center mb-8">

        <span class="text-5xl">
          👨‍💼
        </span>

      </div>

      <h1 class="text-4xl font-bold text-center">

        Employee Management

      </h1>

      <p class="mt-4 text-blue-100 text-center leading-7">

        Manage Employees Easily <br>
        Add, Edit, Delete & Track Employee Information.

      </p>

      <div class="mt-10 grid grid-cols-2 gap-4 w-full">

        <div class="bg-white/10 rounded-xl p-4 text-center backdrop-blur-sm">

          <h3 class="text-3xl font-bold">
            100%
          </h3>

          <p class="text-sm text-blue-100">
            Secure
          </p>

        </div>

        <div class="bg-white/10 rounded-xl p-4 text-center backdrop-blur-sm">

          <h3 class="text-3xl font-bold">
            24/7
          </h3>

          <p class="text-sm text-blue-100">
            Available
          </p>

        </div>

      </div>

    </div>

    <!-- Right Side -->
    <div class="flex flex-col justify-center p-8 md:p-10">

      <div class="text-center">

        <div class="mx-auto w-16 h-16 rounded-full bg-blue-100 flex items-center justify-center">

          <span class="text-3xl">
            🔐
          </span>

        </div>

        <h2 class="mt-5 text-3xl font-bold text-gray-800">

          Welcome Back

        </h2>

        <p class="mt-2 text-gray-500">

          Sign in to continue

        </p>

      </div>

      <!-- Email -->
      <div class="mt-6">

        <label class="block text-sm font-semibold text-gray-700 mb-2">

          Email Address

        </label>

        <input type="email" [(ngModel)]="email" placeholder="Enter your email" class="w-full rounded-xl border border-gray-300 px-4 py-2.5
                 focus:outline-none focus:ring-2 focus:ring-blue-500
                 focus:border-blue-500 transition" />

      </div>

      <!-- Password -->
      <div class="mt-5">

        <label class="block text-sm font-semibold text-gray-700 mb-2">

          Password

        </label>

        <input type="password" [(ngModel)]="password" placeholder="Enter your password" class="w-full rounded-xl border border-gray-300 px-4 py-2.5
                 focus:outline-none focus:ring-2 focus:ring-blue-500
                 focus:border-blue-500 transition" />

      </div>

      <!-- Remember Me -->
      <div class="flex justify-between items-center mt-5">

        <label class="flex items-center gap-2 text-sm text-gray-600">

          <input type="checkbox" class="rounded text-blue-600">

          Remember Me

        </label>

        <a href="#" class="text-blue-600 text-sm hover:underline">

          Forgot Password?

        </a>

      </div>

      <!-- Login Button -->
      <button (click)="login()" class="mt-6 w-full bg-gradient-to-r from-blue-600 to-indigo-700
               hover:from-blue-700 hover:to-indigo-800
               text-white font-semibold py-3 rounded-xl
               shadow-lg hover:shadow-xl transition-all duration-300
               hover:scale-[1.02]">

        Login

      </button>

      <!-- Divider -->
      <div class="flex items-center my-6">

        <div class="flex-1 border-t"></div>

        <span class="px-4 text-gray-400 text-sm">

          Employee Portal

        </span>

        <div class="flex-1 border-t"></div>

      </div>

      <!-- Footer -->
      <p class="text-center text-gray-500 text-sm">

        © 2026 Employee Management System

      </p>

    </div>

  </div>

</div>
